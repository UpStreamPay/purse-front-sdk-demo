name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Sandbox defaults baked into the showcase so every demo runs without a
    # debug-panel override. Tenant and API key come from repository variables.
    env:
      VITE_PURSE_PROXY_URL: https://usp-widget-merchant.purse-sandbox.com
      VITE_PURSE_SECUREFIELDS_TENANT_ID: ${{ vars.VITE_PURSE_SECUREFIELDS_TENANT_ID }}
      VITE_PURSE_API_KEY: ${{ vars.VITE_PURSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci

      - name: Build vanilla
        env:
          VITE_BASE_URL: /vanilla/
        run: npm run build -w vanilla

      - name: Build react
        env:
          VITE_BASE_URL: /react/
        run: npm run build -w react

      - name: Assemble dist
        run: |
          mkdir -p dist/vanilla dist/react
          cp -r vanilla/dist/. dist/vanilla/
          cp -r react/dist/. dist/react/
          cp index.html dist/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
