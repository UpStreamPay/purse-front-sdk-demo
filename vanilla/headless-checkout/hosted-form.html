<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="form.pageTitle">Hosted Form — Quick Start</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Headless"
        variant="violet"
        data-i18n-attr="heading:form.title; description:form.desc"
        source="headless-checkout/hosted-form.ts"
      ></demo-header>

      <demo-stepper steps="step-sdk:step.loadSdk, step-init:step.initCheckout, step-method:step.creditCardMethod, step-form:step.renderForm, step-pay:step.pay"></demo-stepper>

      <demo-notice></demo-notice>

      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5" data-i18n="common.cardDetails"></div>
        <!--
          getPaymentElement() appends a single hosted iframe here.
          The partner controls the look of the form inside the iframe.
          Use PaymentElementOptions to customise labels and theming.
        -->
        <div class="min-h-20 border border-dashed border-border rounded-lg p-4">
          <div id="payment-element">
            <div class="flex items-center justify-center min-h-20 text-muted text-sm" id="form-placeholder" data-i18n="form.loading"></div>
          </div>
        </div>
      </div>

      <demo-button data-i18n-attr="label:common.pay" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/headless-checkout/hosted-form.ts"></script>
  </body>
</html>
