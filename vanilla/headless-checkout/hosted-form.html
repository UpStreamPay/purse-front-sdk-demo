<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hosted Form — Quick Start</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Headless"
        variant="violet"
        heading="Hosted Form — Complete Form"
        source="headless-checkout/hosted-form.ts"
        description="A single hosted iframe containing PAN, expiry, CVV and holder name, rendered via <code>method.getPaymentElement()</code>."
      ></demo-header>

      <demo-stepper steps="step-sdk:Load SDK, step-init:Init checkout, step-method:Credit card method, step-form:Render form, step-pay:Pay"></demo-stepper>

      <demo-notice></demo-notice>

      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5">Card details</div>
        <!--
          getPaymentElement() appends a single hosted iframe here.
          The partner controls the look of the form inside the iframe.
          Use PaymentElementOptions to customise labels and theming.
        -->
        <div class="min-h-20 border border-dashed border-border rounded-lg p-4">
          <div id="payment-element">
            <div class="flex items-center justify-center min-h-20 text-muted text-sm" id="form-placeholder">Loading form…</div>
          </div>
        </div>
      </div>

      <demo-button label="Pay" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/headless-checkout/hosted-form.ts"></script>
  </body>
</html>
