<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headless Checkout — Quick Start</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Headless"
        variant="violet"
        heading="Headless Checkout — Quick Start"
        source="headless-checkout/render-methods.ts"
        description="Full flow: load SDK → init checkout → list payment methods → render form → pay button → result."
      ></demo-header>

      <demo-stepper steps="step-sdk:Load SDK, step-init:Init checkout, step-methods:List methods, step-form:Card input, step-pay:Pay"></demo-stepper>

      <demo-notice></demo-notice>

      <div class="bg-white border border-border rounded-xl p-5 mb-4" id="methods-card" style="display:none">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5">Payment methods</div>
        <div class="flex flex-col gap-2" id="method-list"></div>
      </div>

      <div class="bg-white border border-border rounded-xl p-5 mb-4" id="form-card" style="display:none">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5">Payment form</div>
        <div class="min-h-20 border border-dashed border-border rounded-lg p-4">
          <div id="payment-element">
            <div class="flex items-center justify-center min-h-20 text-muted text-sm">Select a method above</div>
          </div>
        </div>
      </div>

      <demo-button label="Pay" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/headless-checkout/render-methods.ts"></script>
  </body>
</html>
