<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="methods.title">Headless Checkout · Quick Start</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Headless"
        variant="violet"
        data-i18n-attr="heading:methods.title; description:methods.desc"
        source="headless-checkout/render-methods.ts"
      ></demo-header>

      <demo-stepper steps="step-sdk:step.loadSdk, step-init:step.initCheckout, step-methods:step.listMethods, step-form:step.cardInput, step-pay:step.pay"></demo-stepper>

      <demo-notice></demo-notice>

      <div class="bg-white border border-border rounded-xl p-5 mb-4" id="methods-card" style="display:none">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5" data-i18n="methods.list"></div>
        <demo-option-list data-i18n-attr="empty-text:methods.empty"></demo-option-list>
      </div>

      <div class="bg-white border border-border rounded-xl p-5 mb-4" id="form-card" style="display:none">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5" data-i18n="methods.form"></div>
        <div class="min-h-20 border border-dashed border-border rounded-lg p-4">
          <div id="payment-element">
            <div class="flex items-center justify-center min-h-20 text-muted text-sm" data-i18n="methods.selectAbove"></div>
          </div>
        </div>
      </div>

      <demo-button data-i18n-attr="label:common.pay" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/headless-checkout/render-methods.ts"></script>
  </body>
</html>
