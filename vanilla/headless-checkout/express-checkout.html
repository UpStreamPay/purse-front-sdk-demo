<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="express.pageTitle">Headless Checkout — Express Checkout</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Headless"
        variant="violet"
        data-i18n-attr="heading:express.title; description:express.desc"
        source="headless-checkout/express-checkout.ts"
      ></demo-header>

      <demo-stepper steps="step-sdk:step.loadSdk, step-init:step.initCheckout, step-ready:step.listTokens, step-pay:step.pay"></demo-stepper>

      <demo-notice></demo-notice>

      <!-- Demo-only controls — not part of a real integration, just ways to
           force each SDK path so both are reachable from one session. -->
      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5" data-i18n="express.controls"></div>
        <div class="flex flex-col gap-3">
          <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
            <input type="checkbox" id="force-no-token" class="accent-accent" />
            <span data-i18n="express.ignoreTokens"></span>
            <span id="token-status" class="ml-auto text-xs text-muted"></span>
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
            <input type="checkbox" id="no-cvv" class="accent-accent" />
            <span data-i18n-html="express.forceNoCvv"></span>
          </label>
        </div>
      </div>

      <!-- ── Phone frame ─────────────────────────────────────────── -->
      <div class="xc-phone">

        <div class="xc-shopbar">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-[5px] flex items-center justify-center text-[10px] font-bold text-white" style="background: var(--xc-accent)">MS</div>
            <div class="text-lg tracking-tight">My Shop</div>
          </div>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.3L21 7.5H6"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg>
        </div>

        <!-- Product page -->
        <div class="flex-1 overflow-y-auto">
          <div class="relative h-[300px] bg-[#f5f5f3]">
            <img src="../express-checkout/product-chair.jpg" data-i18n-attr="alt:shop.productName" class="w-full h-full object-cover" />
            <span class="absolute left-4 bottom-4 px-3 py-1 rounded-full bg-white/90 text-xs" data-i18n="shop.inStock"></span>
          </div>
          <div class="px-4 pt-5 pb-8">
            <div class="text-2xl tracking-tight" data-i18n="shop.productName"></div>
            <div class="text-xl mt-2">79,99 €</div>
            <div class="xc-divider my-4"></div>
            <p class="text-sm leading-[21px]" style="color: var(--xc-muted)" data-i18n="shop.productDesc"></p>
            <button id="buy-now" disabled class="xc-btn-primary w-full mt-6" data-i18n="shop.buyNow"></button>
          </div>
        </div>

        <!-- Backdrop -->
        <div id="backdrop" hidden class="absolute inset-0 z-[8] bg-black/40"></div>

        <!-- ── Express sheet ───────────────────────────────────────────
             One "tunnel": paying by card, or picking another method, continues
             inside this same sheet (the card step swaps in), never a second
             sheet stacked on top. -->
        <div id="sheet" hidden class="xc-sheet">
          <div class="xc-sheet-handle"><span></span></div>
          <div class="xc-sheet-header">
            <button id="card-back" hidden class="xc-icon-btn absolute left-4" data-i18n-attr="aria-label:shop.back">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </button>
            <div id="sheet-title" class="xc-sheet-title"></div>
            <button data-close class="xc-icon-btn absolute right-4" data-i18n-attr="aria-label:shop.close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>

          <!-- Step 1 — express summary -->
          <div id="view-express" class="xc-sheet-body">
            <!-- Customer info (mock — in a real integration this comes from your account system) -->
            <div class="flex flex-col gap-4">
              <div class="text-base font-medium" style="color: #364153" data-i18n="shop.myInfo"></div>
              <div class="xc-info-card">
                <div class="xc-name">Camille Lourme</div>
                <div class="xc-meta">0601020304</div>
                <div class="xc-meta">c.lourme@gmail.com</div>
              </div>
            </div>

            <div class="xc-divider"></div>

            <!-- Delivery (cosmetic: the charged amount is fixed by the payment session) -->
            <div class="flex flex-col gap-4">
              <div class="text-base font-medium" style="color: #364153" data-i18n="shop.delivery"></div>
              <label class="ship-option">
                <input type="radio" name="ship" value="home" checked class="sr-only" />
                <div class="flex-1">
                  <div class="text-sm font-medium" style="color: var(--xc-ink-2)" data-i18n="shop.home"></div>
                  <div class="text-xs" style="color: var(--xc-muted)" data-i18n="shop.homeDetail"></div>
                </div>
              </label>
              <label class="ship-option">
                <input type="radio" name="ship" value="store" class="sr-only" />
                <div class="flex-1">
                  <div class="text-sm font-medium" style="color: var(--xc-ink-2)" data-i18n="shop.store"></div>
                  <div class="text-xs" style="color: var(--xc-muted)" data-i18n="shop.storeDetail"></div>
                </div>
              </label>
            </div>

            <div class="xc-divider"></div>

            <!-- Payment -->
            <div class="flex flex-col gap-4">
              <div class="text-base font-medium" style="color: #364153" data-i18n="shop.payment"></div>
              <div class="xc-total-row">
                <div class="text-sm" style="color: #364153" data-i18n="shop.total"></div>
                <div class="text-xl font-semibold" style="color: var(--xc-ink-2)" data-total></div>
              </div>

              <button id="express-pay" class="xc-btn-primary w-full justify-between px-4">
                <span id="express-pay-label"></span>
                <span id="express-pay-token" hidden class="xc-badge">
                  <img id="token-icon" alt="" />
                  <span id="token-pan" class="text-xs"></span>
                </span>
              </button>

              <!-- Token path: the CVV hosted field is mounted collapsed, below the
                   button, and only revealed (and scrolled to) by a first tap on
                   "Payer" when the token needs it. -->
              <div id="token-cvv-field" class="xc-collapse">
                <div class="xc-field">
                  <label><span data-i18n="shop.cvvFor"></span> <span id="token-cvv-card"></span></label>
                  <div class="hf-field-wrap" id="token-cvv"></div>
                </div>
              </div>

              <!-- Wallets the session offers (Google Pay, Apple Pay, PayPal in popup
                   mode). Each slot appears once its button is ready; the block and
                   its separator only when at least one is. -->
              <div id="xpay-block" hidden class="flex flex-col gap-3">
                <div class="xc-separator" data-i18n="shop.orPayWith"></div>
                <div id="xpay-googlepay" hidden></div>
                <div id="xpay-applepay" hidden></div>
                <div id="xpay-paypal" hidden></div>
              </div>

              <button id="other-method" hidden class="xc-link mx-auto" data-i18n="shop.otherMethod"></button>
            </div>
          </div>

          <!-- Step 2 — new card, in the same sheet -->
          <div id="view-card" hidden class="xc-sheet-body">
            <div class="xc-field">
              <label data-i18n="shop.cardNumber"></label>
              <div class="hf-field-wrap" id="xc-pan"></div>
            </div>
            <div class="flex gap-3">
              <div class="xc-field flex-1 min-w-0">
                <label data-i18n="shop.expiry"></label>
                <div class="hf-field-wrap" id="xc-exp"></div>
              </div>
              <div class="xc-field flex-1 min-w-0">
                <label data-i18n="shop.cvv"></label>
                <div class="hf-field-wrap" id="xc-cvv"></div>
              </div>
            </div>
            <div class="xc-field">
              <label data-i18n="shop.holder"></label>
              <div class="hf-field-wrap" id="xc-name"></div>
            </div>

            <label id="save-card-box" hidden class="rounded bg-[#f3f4f6] p-4 flex items-center gap-2 text-sm cursor-pointer" style="color: var(--xc-ink-2)">
              <input type="checkbox" id="save-card" style="accent-color: var(--xc-accent)" />
              <span data-i18n="shop.saveCard"></span>
            </label>

            <button id="card-pay" disabled class="xc-btn-primary w-full"><span data-i18n="shop.pay"></span> <span data-total></span></button>
            <div class="flex items-center justify-center gap-2 text-sm" style="color: #364153">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="15" height="10" x="4.5" y="11" rx="2.2"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11"/></svg>
              <span data-i18n="shop.securePayment"></span>
            </div>
          </div>
        </div>

        <!-- ── Busy overlay ────────────────────────────────────────── -->
        <div id="busy" hidden class="xc-overlay bg-white/95">
          <div class="w-9 h-9 rounded-full border-[2.5px] animate-spin" style="border-color: var(--xc-hairline); border-top-color: var(--xc-accent)"></div>
          <div class="text-sm" style="color: var(--xc-muted-2)" data-i18n="shop.processing"></div>
        </div>

        <!-- ── Confirmation ────────────────────────────────────────── -->
        <!-- Shown after submitPayment(): either in place, or — the usual case — when
             the SDK brings the shopper back here with ?purse-redirection-data. -->
        <div id="done" hidden class="xc-overlay bg-white px-6 text-center" style="z-index: 15">
          <div id="done-ok" class="w-16 h-16 rounded-full flex items-center justify-center" style="background: var(--xc-accent)">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div id="done-failed" hidden class="w-16 h-16 rounded-full flex items-center justify-center bg-[#364153]">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </div>
          <div id="done-title" class="text-2xl tracking-tight mt-5"></div>
          <div id="done-detail" class="text-sm mt-3 max-w-[280px]" style="color: #364153"></div>
          <div id="done-ref" class="text-xs mt-2" style="color: var(--xc-muted-2)"></div>
          <button id="back-home" class="xc-btn-primary w-full mt-8" data-i18n="shop.backHome"></button>
        </div>
      </div>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/headless-checkout/express-checkout.ts"></script>
  </body>
</html>
