<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="complete.title">Advanced Flow — Complete Payment</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Advanced Flow"
        variant="amber"
        data-i18n-attr="heading:complete.title; description:complete.desc"
        source="advanced-flow/complete-payment.ts"
      ></demo-header>

      <demo-stepper steps="step-eligible:step.eligible, step-form:step.cardForm, step-3ds:step.threeDsVersioning, step-pay:step.createPayment, step-redirect:step.redirection"></demo-stepper>

      <demo-notice></demo-notice>

      <!-- Step 1 — eligible payment solutions returned for the order -->
      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5" data-i18n="complete.eligible"></div>
        <demo-chips data-i18n-attr="empty-text:complete.checking"></demo-chips>
        <p class="text-xs text-muted mt-3" data-i18n-html="complete.pickHint"></p>
        <p class="text-xs text-muted mt-2" data-i18n="complete.walletHint"></p>
      </div>

      <!-- Step 4 opt-in — read at Secure Fields init, so toggling it re-mounts
           the form below (and clears anything typed into it) -->
      <label class="flex items-center gap-2 text-xs text-muted mb-4 cursor-pointer">
        <input type="checkbox" id="three-ds" class="cursor-pointer" checked />
        <span data-i18n-html="complete.threeDs"></span>
      </label>

      <!-- Steps 2–3 — Secure Fields card form (PCI-safe iframes) -->
      <sf-card-form fields="pan exp cvv name" brand></sf-card-form>

      <!-- Step 4 — 3DS: versioning + device fingerprint, run by Secure Fields
           inside submit(). Frictionless only — no challenge is handled here. -->
      <div id="threeds-box" class="bg-white border border-border rounded-xl p-5 mt-4" hidden>
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5">3DS</div>
        <p class="text-xs text-muted">
          <code>threeDSServerTransID</code>:
          <span id="threeds-trans-id" class="font-mono text-text">—</span>
        </p>
      </div>

      <!-- Step 5 — token registration consent -->
      <label class="flex items-center gap-2 text-xs text-muted mt-4 cursor-pointer">
        <input type="checkbox" id="save-token" class="cursor-pointer" />
        <span data-i18n-html="complete.saveToken"></span>
      </label>

      <demo-button data-i18n-attr="label:common.pay" disabled></demo-button>

      <demo-result></demo-result>

      <!-- Step 6 — the payment exists, but the shopper may still owe a redirection -->
      <demo-redirection></demo-redirection>
    </div>
    <script type="module" src="/src/advanced-flow/complete-payment.ts"></script>
  </body>
</html>
