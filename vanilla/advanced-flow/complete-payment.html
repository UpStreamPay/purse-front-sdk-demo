<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Flow — Complete Payment</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Advanced Flow"
        variant="amber"
        heading="Advanced Flow — Complete Payment"
        source="advanced-flow/complete-payment.ts"
        description="Drive the raw Payment API v2 yourself: <code>eligible-solutions</code> → Secure Fields card form → <code>create_payment</code>. The v2 endpoints are proxied by a merchant backend (they require a server-side bearer token) — set the <strong>Proxy URL</strong> in the config panel."
      ></demo-header>

      <demo-stepper steps="step-eligible:Eligible, step-form:Card form, step-pay:Create payment"></demo-stepper>

      <demo-notice></demo-notice>

      <!-- Step 1 — eligible payment solutions returned for the order -->
      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5">Eligible solutions</div>
        <demo-chips empty-text="Checking eligibility…"></demo-chips>
        <p class="text-xs text-muted mt-3">
          For a returning customer you would also list saved cards here (wallet tokens).
          This demo covers the new-card path.
        </p>
      </div>

      <!-- Steps 2–3 — Secure Fields card form (PCI-safe iframes) -->
      <sf-card-form fields="pan exp cvv name" brand></sf-card-form>

      <!-- Step 5 — token registration consent -->
      <label class="flex items-center gap-2 text-xs text-muted mt-4 cursor-pointer">
        <input type="checkbox" id="save-token" class="cursor-pointer" />
        Save this card for future payments (<code>save_token</code>)
      </label>

      <demo-button label="Pay" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/advanced-flow/complete-payment.ts"></script>
  </body>
</html>
