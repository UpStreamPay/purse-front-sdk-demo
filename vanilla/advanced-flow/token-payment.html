<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Flow — Token Payment</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Advanced Flow"
        variant="amber"
        heading="Advanced Flow — Token Payment"
        source="advanced-flow/token-payment.ts"
        description="Pay with a returning customer's <strong>saved card</strong>: list wallet tokens → pick one → re-enter <strong>CVV only</strong> via Secure Fields → <code>create_payment</code> with <code>wallet_token</code>. The v2 and wallet endpoints are proxied by a merchant backend — set the <strong>Proxy URL</strong> in the config panel."
      ></demo-header>

      <demo-stepper steps="step-tokens:Saved cards, step-cvv:CVV, step-pay:Create payment"></demo-stepper>

      <demo-notice></demo-notice>

      <!-- Step 1 — saved card tokens for the returning customer -->
      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5">Saved cards</div>
        <div class="flex flex-col gap-2" id="token-list">
          <div class="text-xs text-muted">Loading saved cards…</div>
        </div>
      </div>

      <!-- Step 2 — Secure Fields CVV-only form (PCI-safe iframe) -->
      <sf-card-form fields="cvv"></sf-card-form>

      <demo-button label="Pay with saved card" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/advanced-flow/token-payment.ts"></script>
  </body>
</html>
