<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="token.title">Advanced Flow · Token Payment</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Advanced Flow"
        variant="amber"
        data-i18n-attr="heading:token.title; description:token.desc"
        source="advanced-flow/token-payment.ts"
      ></demo-header>

      <demo-stepper steps="step-tokens:step.savedCards, step-cvv:common.cvv, step-pay:step.createPayment"></demo-stepper>

      <demo-notice></demo-notice>

      <!-- Step 1 — saved card tokens for the returning customer -->
      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5" data-i18n="token.savedCards"></div>
        <demo-option-list mono uppercase-secondary data-i18n-attr="empty-text:token.loading"></demo-option-list>
      </div>

      <!-- Step 2 — Secure Fields CVV-only form (PCI-safe iframe) -->
      <sf-card-form fields="cvv"></sf-card-form>

      <demo-button data-i18n-attr="label:token.payWithSaved" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/advanced-flow/token-payment.ts"></script>
  </body>
</html>
