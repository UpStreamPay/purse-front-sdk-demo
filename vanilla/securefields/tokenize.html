<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="sf.pageTitle">Secure Fields · Quick Start</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Secure Fields"
        variant="pink"
        data-i18n-attr="heading:sf.title; description:sf.desc"
        source="securefields/tokenize.ts"
      ></demo-header>

      <demo-stepper steps="step-sdk:step.loadSdk, step-init:step.initFields, step-render:step.fieldsReady, step-submit:step.tokenise"></demo-stepper>

      <demo-notice></demo-notice>

      <sf-card-form fields="pan exp cvv name" brand></sf-card-form>

      <demo-button data-i18n-attr="label:common.submit" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/securefields/tokenize.ts"></script>
  </body>
</html>
