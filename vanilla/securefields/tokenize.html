<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Fields — Quick Start</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Secure Fields"
        variant="pink"
        heading="Secure Fields — Integration"
        source="securefields/tokenize.ts"
        description="<code>initSecureFields</code> → fields rendered in iframes → submit → vault token returned. No session required — operates at tenant level."
      ></demo-header>

      <demo-stepper steps="step-sdk:Load SDK, step-init:Init fields, step-render:Fields ready, step-submit:Tokenise"></demo-stepper>

      <demo-notice></demo-notice>

      <sf-card-form fields="pan exp cvv name" brand></sf-card-form>

      <demo-button label="Submit" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/securefields/tokenize.ts"></script>
  </body>
</html>
