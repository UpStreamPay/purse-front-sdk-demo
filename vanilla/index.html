<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

            <p class="text-muted text-sm" data-i18n-html="landing.intro"></p>

            <demo-locale-picker></demo-locale-picker>
            <a href="https://github.com/UpStreamPay/purse-front-sdk-demo/tree/main/vanilla/src" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-muted no-underline text-xs hover:text-text border border-border rounded-md px-2 py-1">

            <span data-i18n="common.viewSource"></span>
          </a>
          </div>
        </div>
      </div>

      <div class="flex gap-3 px-4 py-3.5 bg-yellow-50 border border-yellow-300 rounded-lg text-sm text-yellow-900 mb-6">
        <span>⚠</span>
        <span data-i18n-html="landing.warning"></span>
      </div>

      <h2 class="text-base font-bold mb-3 mt-2" data-i18n="landing.section.dropin"></h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-0 mb-7">
        <a href="dropin/widget.html" class="block p-4 bg-white border border-border rounded-xl no-underline text-inherit transition-all hover:border-accent hover:ring-2 hover:ring-accent/10">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-blue-100 text-blue-800">Drop-in</span>
          <div class="font-semibold text-base my-2" data-i18n="landing.card.quickStart"></div>
          <div class="text-sm text-muted" data-i18n-html="landing.card.dropin"></div>
        </a>
      </div>

      <h2 class="text-base font-bold mb-3 mt-2" data-i18n="landing.section.headless"></h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-0 mb-7">
        <a href="headless-checkout/render-methods.html" class="block p-4 bg-white border border-border rounded-xl no-underline text-inherit transition-all hover:border-accent hover:ring-2 hover:ring-accent/10">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-violet-100 text-violet-800">Headless</span>
          <div class="font-semibold text-base my-2" data-i18n="landing.card.renderMethods"></div>
          <div class="text-sm text-muted" data-i18n="landing.card.renderMethodsDesc"></div>

        <a href="headless-checkout/hosted-form.html" class="block p-4 bg-white border border-border rounded-xl no-underline text-inherit transition-all hover:border-accent hover:ring-2 hover:ring-accent/10">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-violet-100 text-violet-800">Headless</span>
          <div class="font-semibold text-base my-2" data-i18n="landing.card.hostedForm"></div>
          <div class="text-sm text-muted" data-i18n-html="landing.card.hostedFormDesc"></div>

        <a href="headless-checkout/hosted-fields.html" class="block p-4 bg-white border border-border rounded-xl no-underline text-inherit transition-all hover:border-accent hover:ring-2 hover:ring-accent/10">

          <div class="font-semibold text-base my-2" data-i18n="landing.card.hostedFields"></div>
          <div class="text-sm text-muted" data-i18n="landing.card.hostedFieldsDesc"></div>
        </a>
        <a href="headless-checkout/express-checkout.html" class="block p-4 bg-white border border-border rounded-xl no-underline text-inherit transition-all hover:border-accent hover:ring-2 hover:ring-accent/10">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-violet-100 text-violet-800">Headless</span>
          <div class="font-semibold text-base my-2" data-i18n="landing.card.express"></div>
          <div class="text-sm text-muted" data-i18n-html="landing.card.expressDesc"></div>
        </a>
      </div>

      <h2 class="text-base font-bold mb-3 mt-2" data-i18n="landing.section.advanced"></h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-0 mb-7">
        <a href="advanced-flow/complete-payment.html" class="block p-4 bg-white border border-border rounded-xl no-underline text-inherit transition-all hover:border-accent hover:ring-2 hover:ring-accent/10">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-amber-100 text-amber-800">Advanced Flow</span>
          <div class="font-semibold text-base my-2" data-i18n="landing.card.complete"></div>
          <div class="text-sm text-muted" data-i18n-html="landing.card.completeDesc"></div>
        </a>

        <a href="advanced-flow/token-payment.html" class="block p-4 bg-white border border-border rounded-xl no-underline text-inherit transition-all hover:border-accent hover:ring-2 hover:ring-accent/10">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-amber-100 text-amber-800">Advanced Flow</span>
          <div class="font-semibold text-base my-2" data-i18n="landing.card.token"></div>

          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-pink-100 text-pink-800">Secure Fields</span>
          <div class="font-semibold text-base my-2" data-i18n="landing.card.quickStart"></div>
          <div class="text-sm text-muted" data-i18n-html="landing.card.secureFieldsDesc"></div>
        </a>

    <script type="module" src="/src/landing.ts"></script>

</html>
