<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="dropin.title">Drop-in Checkout — Quick Start</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-20">
      <demo-header
        badge="Drop-in"
        variant="blue"
        data-i18n-attr="heading:dropin.title; description:dropin.desc"
        source="dropin/widget.ts"
      ></demo-header>

      <demo-stepper steps="step-sdk:step.loadSdk, step-init:step.initDropin, step-mount:step.mountWidget, step-pay:step.pay"></demo-stepper>

      <demo-notice></demo-notice>

      <div class="bg-white border border-border rounded-xl p-5 mb-4">
        <div class="text-sm font-semibold text-muted uppercase tracking-wider mb-3.5" data-i18n="dropin.widget"></div>
        <!-- The drop-in renders itself inside this element -->
        <div id="dropin-container"></div>
      </div>

      <!--
        The pay button is optional — the drop-in includes its own pay button by default.
        Use this external button pattern when you need full control over placement
        (e.g. a sticky footer, or a multi-step checkout flow).
      -->
      <demo-button data-i18n-attr="label:common.pay" disabled></demo-button>

      <demo-result></demo-result>
    </div>
    <script type="module" src="/src/dropin/widget.ts"></script>
  </body>
</html>
